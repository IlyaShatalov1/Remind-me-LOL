[package]
name = "remind_me_lol_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
teloxide = { version = "0.17.0", features = ["macros", "sqlite-storage-nativetls", "bincode-serializer"] }
log = "0.4"
pretty_env_logger = "0.5"
tokio = { version =  "1.8", features = ["rt-multi-thread", "macros"] }
tzf-rs = "1.1.5"
chrono = "0.4.44"
chrono-tz = "0.10.4"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "sqlite", "macros" ] }
serde = "1.0.228"

[profile.release]
codegen-units = 256 # Максимально дробим код для параллельной работы LLVM
incremental = true   # Включает инкрементальную сборку (в релизе по дефолту выключена)


[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Clink-arg=--ld-path=wild"]
